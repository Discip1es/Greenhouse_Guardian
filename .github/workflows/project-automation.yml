name: Project Automation

on:
  issues:
    types: [opened, labeled, closed]
  pull_request:
    types: [opened, closed, reopened]

jobs:
  automate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Move to In Review on PR Opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: alex-page/github-project-automation-plus@v0.8.3
        with:
          project: Greenhouse Guardian Development
          column: In Review
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Move to Done on PR Closed
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: alex-page/github-project-automation-plus@v0.8.3
        with:
          project: Greenhouse Guardian Development
          column: Done
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Move to Done on Issue Closed
        if: github.event_name == 'issues' && github.event.action == 'closed'
        uses: alex-page/github-project-automation-plus@v0.8.3
        with:
          project: Greenhouse Guardian Development
          column: Done
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add label-based priority field
        if: github.event_name == 'issues' && github.event.action == 'labeled'
        run: |
          echo "Priority label added: ${{ github.event.label.name }}"
          # Здесь можно добавить логику для обновления custom fields через GitHub API
